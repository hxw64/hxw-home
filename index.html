<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>何欣蔚 | 个人主页</title>
  <meta name="description" content="何欣蔚的个人主页：天津大学智能医学工程本科生" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top">何欣蔚</a>
    <nav class="nav" aria-label="Main navigation">
      <a href="#about" data-i18n="navAbout">关于我</a>
      <a href="#skills" data-i18n="navSkills">经历与技能</a>
      <a href="#projects" data-i18n="navProjects">项目</a>
      <a href="#contact" data-i18n="navContact">联系</a>
    </nav>
    <button id="langToggle" class="lang-btn" type="button" aria-label="Switch to English">EN</button>
  </header>

  <main id="top">
    <section class="hero">
      <div class="avatar" aria-hidden="true">何</div>
      <h1>何欣蔚</h1>
      <p class="tagline" data-i18n="tagline">Conquer zenith light.</p>
      <a class="btn btn-primary" href="#contact" data-i18n="contactBtn">联系我</a>
    </section>

    <section class="card about" id="about">
      <h2 data-i18n="aboutTitle">关于我</h2>
      <p data-i18n="aboutText1">我是何欣蔚，天津大学智能医学工程专业本科生</p>
      <p data-i18n="aboutText2">我喜欢探索新鲜事物，也喜欢音乐</p>
    </section>

    <section class="card skills" id="skills">
      <h2 data-i18n="skillsTitle">经历与技能</h2>
      <h3 class="sub-title" data-i18n="eduLabel">教育背景</h3>
      <p class="sub-text" data-i18n="eduText">天津大学 · 智能医学工程 · 本科在读</p>
      <h3 class="sub-title" data-i18n="interestLabel">兴趣与特长</h3>
      <ul class="tag-list">
        <li data-i18n="tagErhu">二胡</li>
        <li data-i18n="tagSeal">篆刻</li>
      </ul>
    </section>

    <section class="card projects" id="projects">
      <h2 data-i18n="projectsTitle">项目</h2>
      <p data-i18n="projectsText">项目案例正在整理中，将陆续分享课程项目与设计探索</p>
    </section>

    <section class="card contact" id="contact">
      <h2 data-i18n="contactTitle">联系我</h2>
      <p data-i18n="contactHint">欢迎联系我</p>
      <p><a class="email-line" href="mailto:xinwei_he@tju.edu.cn"><span data-i18n="emailLabel">邮箱：</span>xinwei_he@tju.edu.cn</a></p>
      <a class="btn btn-primary" href="mailto:xinwei_he@tju.edu.cn" data-i18n="sendEmailBtn">发送邮件</a>
    </section>

    <section class="card board" id="board">
      <h2 data-i18n="boardTitle">留言板</h2>
      <form id="msgForm" class="msg-form" autocomplete="off" novalidate>
        <label for="msgNick" data-i18n="nickLabel">昵称</label>
        <input id="msgNick" type="text" maxlength="20" />
        <label for="msgText" data-i18n="msgLabel">留言</label>
        <textarea id="msgText" rows="3" maxlength="500" required data-i18n-placeholder="msgPlaceholder" placeholder="写点什么…"></textarea>
        <label class="anon-wrap">
          <input id="msgAnon" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
          <span data-i18n="anonLabel">匿名</span>
        </label>
        <button class="btn btn-primary" type="submit" data-i18n="sendBtn">发送</button>
      </form>
      <ul id="msgList" class="msg-list"></ul>
      <button id="msgClear" class="clear-btn" type="button" data-i18n="clearBtn">清空留言</button>
    </section>
  </main>

  <footer>
    <p>© 2026 何欣蔚 · He Xinwei</p>
    <p data-i18n="footerNote">本网站为本地静态页面，不收集任何信息</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
